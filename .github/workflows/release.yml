name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      SNAPLING_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: choco install innosetup --no-progress -y
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            target/dist/Snapling-Setup.exe
            target/dist/Snapling-Setup.exe.sha256
            target/dist/Snapling-portable.zip
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    env:
      SNAPLING_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libxkbcommon-dev libwayland-dev
      - run: cargo build --locked --release -p snapling-app
      - run: |
          mkdir -p target/dist
          cp target/release/snapling target/dist/snapling-linux-x86_64
          target/dist/snapling-linux-x86_64 --version
          mkdir -p target/linux-package
          cp target/release/snapling target/linux-package/snapling
          cp assets/brand/app-icon.svg target/linux-package/snapling.svg
          cp packaging/linux/install.sh LICENSE THIRD_PARTY_NOTICES.md target/linux-package/
          tar -C target/linux-package -czf target/dist/snapling-linux-x86_64.tar.gz .
          cd target/dist
          sha256sum snapling-linux-x86_64 > snapling-linux-x86_64.sha256
          sha256sum snapling-linux-x86_64.tar.gz > snapling-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            target/dist/snapling-linux-x86_64
            target/dist/snapling-linux-x86_64.sha256
            target/dist/snapling-linux-x86_64.tar.gz
            target/dist/snapling-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
