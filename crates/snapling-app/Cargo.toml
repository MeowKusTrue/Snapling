[package]
name = "snapling-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "snapling"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui-phosphor = "0.14.0"
raw-window-handle = "0.6.2"
snapling-core = { path = "../snapling-core" }
snapling-scene = { path = "../snapling-scene" }
snapling-translate = { path = "../snapling-translate" }
toml = { version = "1.1.8", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(not(windows))'.dependencies]
snapling-overlay = { path = "../snapling-overlay" }
snapling-unix = { path = "../snapling-unix" }

[target.'cfg(windows)'.dependencies]
snapling-win = { path = "../snapling-win" }
tray-icon = "0.24.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
