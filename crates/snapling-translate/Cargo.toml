[package]
name = "snapling-translate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
snapling-core = { path = "../snapling-core" }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-31"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
ureq = { version = "3", default-features = false, features = ["native-tls", "socks-proxy"] }

[dev-dependencies]
snapling-scene = { path = "../snapling-scene" }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
