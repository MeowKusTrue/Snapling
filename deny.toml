[advisories]
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained; build-time only, pulled by tray-icon deps" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "OFL-1.1", "MPL-2.0", "BSL-1.0", "CC0-1.0", "Ubuntu-font-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
