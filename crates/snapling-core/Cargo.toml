[package]
name = "snapling-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ab_glyph = "0.2.32"
epaint_default_fonts = "0.36.2"
gif = "0.14"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "display"] }
